events {}

http {
  # Log com o servidor de origem ($upstream_addr): evidência para o teste 6.
  log_format lb '$remote_addr [$time_local] "$request" status=$status '
                'upstream=$upstream_addr tempo=$upstream_response_time';
  access_log /dev/stdout lb;
  error_log  /dev/stderr warn;

  # Política padrão: round-robin (alterna em ordem entre os servidores).
  # Alternativas: "least_conn;" (menos conexões ativas) ou "ip_hash;" (sticky por IP).
  upstream app_servers {
    server app1:3000 max_fails=2 fail_timeout=10s;
    server app2:3000 max_fails=2 fail_timeout=10s;
    server app3:3000 max_fails=2 fail_timeout=10s;
    # server app4:3000 max_fails=2 fail_timeout=10s;   # <- descomente no teste de escala
  }

  server {
    listen 80;

    location / {
      proxy_pass http://app_servers;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Se uma instância falhar, tenta a próxima de forma transparente (health check passivo).
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_connect_timeout 2s;
    }
  }
}
