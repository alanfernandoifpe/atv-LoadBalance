# Três instâncias idênticas (mesma imagem); só mudam as variáveis de ambiente.
x-app: &app
  build: ./app
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
    interval: 5s
    timeout: 2s
    retries: 3

services:
  app1:
    <<: *app
    environment: { INSTANCE_ID: app-01, COLOR: "#1e66d0", PORT: "3000" }
  app2:
    <<: *app
    environment: { INSTANCE_ID: app-02, COLOR: "#2e9e4f", PORT: "3000" }
  app3:
    <<: *app
    environment: { INSTANCE_ID: app-03, COLOR: "#e07b00", PORT: "3000" }

  # (teste de escala) Suba com: docker compose --profile scale up -d app4
  app4:
    <<: *app
    profiles: ["scale"]
    environment: { INSTANCE_ID: app-04, COLOR: "#8e44ad", PORT: "3000" }

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"          # ÚNICO ponto de entrada
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1: { condition: service_healthy }
      app2: { condition: service_healthy }
      app3: { condition: service_healthy }
    restart: unless-stopped
